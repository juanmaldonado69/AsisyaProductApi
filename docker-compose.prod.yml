version: '4.2'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-asisya-prod
    environment:
      POSTGRES_DB: asisyaproductdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourSecurePassword123!
    ports:
      - "5433:5432"  # <-- Cambiado a 5433 en la máquina host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asisyaproductdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: always

  backend:
    image: ghcr.io/juanmaldonado69/asisyaproductapi:latest
    container_name: asisyaproductapi-prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # NOTA: Internamente en la red de docker sigue usando Host=postgres;Port=5432
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=asisyaproductdb;Username=postgres;Password=YourSecurePassword123!
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    image: ghcr.io/juanmaldonado69/asisya-frontend:latest
    container_name: asisya-frontend-prod
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data_prod: